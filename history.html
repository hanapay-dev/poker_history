<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand History - Poker Action Logger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>Hand History</h1>
    <div class="header-controls">
      <a href="index.html" class="btn-link">プレイ画面へ戻る</a>
    </div>
  </header>

  <main class="main-container">
    <div class="history-controls">
      <button onclick="filterHistory('all')" id="filterAll" class="btn-filter active">すべて</button>
      <button onclick="filterHistory('fav')" id="filterFav" class="btn-filter">お気に入り★</button>
      <button onclick="clearAllHistory()" class="btn-clear-all">全削除</button>
    </div>

    <div id="historyList" class="history-list">
      <!-- JSで動的に表示 -->
    </div>
  </main>

  <script src="history.js"></script>
</body>
</html>
